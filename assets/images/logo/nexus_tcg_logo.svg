<!-- Nexus TCG Logo Concept - SVG -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#2E7D32" stroke="#1B5E20" stroke-width="8"/>
  
  <!-- Card Background -->
  <rect x="128" y="160" width="256" height="192" rx="16" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/>
  
  <!-- Card Inner Design -->
  <rect x="148" y="180" width="216" height="152" rx="8" fill="#F5F5F5" stroke="#90A4AE" stroke-width="2"/>
  
  <!-- TCG Symbol - Interconnected hexagons -->
  <g transform="translate(256, 256)">
    <!-- Center hexagon -->
    <polygon points="-20,0 -10,-17.32 10,-17.32 20,0 10,17.32 -10,17.32" 
             fill="#FF6B35" stroke="#D84315" stroke-width="2"/>
    
    <!-- Top hexagon -->
    <polygon points="-20,-34.64 -10,-51.96 10,-51.96 20,-34.64 10,-17.32 -10,-17.32" 
             fill="#4FC3F7" stroke="#0277BD" stroke-width="2"/>
    
    <!-- Bottom hexagon -->
    <polygon points="-20,34.64 -10,17.32 10,17.32 20,34.64 10,51.96 -10,51.96" 
             fill="#81C784" stroke="#388E3C" stroke-width="2"/>
    
    <!-- Left hexagon -->
    <polygon points="-50,-17.32 -40,-34.64 -20,-34.64 -10,-17.32 -20,0 -40,0" 
             fill="#FFB74D" stroke="#F57C00" stroke-width="2"/>
    
    <!-- Right hexagon -->
    <polygon points="40,0 50,-17.32 40,-34.64 20,-34.64 10,-17.32 20,0" 
             fill="#F06292" stroke="#C2185B" stroke-width="2"/>
  </g>
  
  <!-- NEXUS Text -->
  <text x="256" y="110" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="36" font-weight="bold" fill="#FFFFFF">NEXUS</text>
  
  <!-- TCG Text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="28" font-weight="bold" fill="#FFFFFF">TCG</text>
  
  <!-- Decorative border elements -->
  <circle cx="100" cy="100" r="8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="412" cy="100" r="8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="100" cy="412" r="8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="412" cy="412" r="8" fill="#FFFFFF" opacity="0.7"/>
</svg>
