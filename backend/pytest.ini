[tool:pytest]
DJANGO_SETTINGS_MODULE = nexus_api.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --html=test_reports/report.html
    --self-contained-html
testpaths = .
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    api: marks tests as API tests
    slow: marks tests as slow running tests
    authentication: marks tests related to authentication
    communities: marks tests related to communities
    posts: marks tests related to posts
    comments: marks tests related to comments
    reactions: marks tests related to reactions
