version: '3.8'

services:
  # Backend Django API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nexus_tcg_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=docker-dev-secret-key-change-in-production
      - DATABASE_URL=postgres://nexus_user:nexus_password@postgres:5432/nexus_tcg_dev
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - nexus_network

  # PostgreSQL Database
  postgres:
    image: postgres:13-alpine
    container_name: nexus_tcg_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=nexus_tcg_dev
      - POSTGRES_USER=nexus_user
      - POSTGRES_PASSWORD=nexus_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nexus_network

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: nexus_tcg_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexus_network

  # Celery Worker for background tasks
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nexus_tcg_celery
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=docker-dev-secret-key-change-in-production
      - DATABASE_URL=postgres://nexus_user:nexus_password@postgres:5432/nexus_tcg_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: celery -A nexus_api worker --loglevel=info
    networks:
      - nexus_network

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nexus_tcg_celery_beat
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=docker-dev-secret-key-change-in-production
      - DATABASE_URL=postgres://nexus_user:nexus_password@postgres:5432/nexus_tcg_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: celery -A nexus_api beat --loglevel=info
    networks:
      - nexus_network

  # Database administration tool
  adminer:
    image: adminer
    container_name: nexus_tcg_adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - nexus_network

volumes:
  postgres_data:
  redis_data:
  backend_media:

networks:
  nexus_network:
    driver: bridge
